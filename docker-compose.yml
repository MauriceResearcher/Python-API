services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    # Kein "ports:"-Mapping auf den Host: der api-Container erreicht ollama
    # intern über "http://ollama:11434" im Compose-Netzwerk, das reicht.
    # Ollama hat KEINE eingebaute Authentifizierung - eine Freigabe auf
    # allen Host-Interfaces (0.0.0.0) wäre auf einem Server mit offener
    # Firewall von aussen erreichbar. Für lokales Debugging bei Bedarf nur
    # auf localhost binden, z.B.:
    # ports:
    #   - "127.0.0.1:11434:11434"
    restart: unless-stopped

  api:
    build: .
    container_name: python-docs-rag-api
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      # Im Compose-Netzwerk heisst der Ollama-Container "ollama",
      # nicht "localhost" - das ist der wichtigste Unterschied zum
      # lokalen (nicht-containerisierten) Betrieb.
      OLLAMA_BASE_URL: "http://ollama:11434"
    env_file:
      # Enthält GOOGLE_API_KEY etc., siehe .env.example.
      # WICHTIG: .env NICHT ins Image kopieren (siehe Dockerfile) -
      # env_file injiziert es nur zur Laufzeit in den Container.
      - .env
    volumes:
      - qdrant_data:/code/qdrant_db
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data: